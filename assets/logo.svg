  <!-- pupil: sharp diamond cut -->
  <polygon points="128,92 136,104 128,116 120,104" fill="#E8F1FF"/>
  <!-- Rising counter bar beneath eye -->
  <!-- baseline slash -->
  <polyline points="64,184 196,168" stroke="#25F4EE" stroke-width="3" fill="none"/>
  <!-- bars rising, sharp, glitched -->
  <polygon points="76,184 88,184 88,166 76,166" fill="#25F4EE"/>
  <polygon points="96,182 108,182 108,158 96,158" fill="#25F4EE" opacity="0.85"/>
  <polygon points="116,180 128,180 128,148 116,148" fill="#E8F1FF"/>
  <polygon points="136,178 148,178 148,136 136,136" fill="#FE2C55"/>
  <polygon points="156,176 168,176 168,124 156,124" fill="#FE2C55"/>
  <polygon points="176,174 188,174 188,148 176,148" fill="#FE2C55" opacity="0.7"/>
  <!-- glitch fragments: covert motion lines -->
  <polygon points="60,140 84,136 80,142 58,146" fill="#25F4EE" opacity="0.6"/>
  <polygon points="172,96 200,88 196,96 170,102" fill="#FE2C55" opacity="0.5"/>
  <polygon points="140,68 160,62 158,68 138,74" fill="#E8F1FF" opacity="0.4"/>
  <!-- tiny wordmark, small, corner -->
  <text x="128" y="236" font-family="monospace" font-size="9" fill="#E8F1FF" text-anchor="middle" letter-spacing="2" opacity="0.55">tiktok-viewer-bot</text>
