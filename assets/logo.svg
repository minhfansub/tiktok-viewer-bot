  <polygon points="20,128 64,64 192,48 236,112 204,160 56,176" fill="none" stroke="#E8F1FF" stroke-width="3"/>
  <!-- Eye inner glitch slice top -->
  <polygon points="48,104 80,72 176,60 214,108 180,112 84,124" fill="#E8F1FF" opacity="0.06"/>
  <!-- Stacked play-triangles forming eye/iris -->
  <!-- back triangle (offset glitch) -->
